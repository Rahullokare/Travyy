# Render Blueprint: free hosting for the Travyy API (server/).
# Render dashboard → New → Blueprint → select this repo → Apply.
# Free web services sleep after ~15 min without traffic and take 30–60 s to wake;
# the app wakes the server when it opens (src/shared/lib/useWarmUpApi.ts).
services:
  - type: web
    name: travyy-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    # Node 22.18+ runs TypeScript directly: no build step.
    startCommand: node src/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: ALLOWED_ORIGINS
        value: '*'
      - key: INSTAGRAM_CAPTIONS
        value: 'on'
      - key: VIDEO_EXTRACTION
        value: 'on'
      - key: GEOCODER_USER_AGENT
        value: 'Travyy/1.0 (replace with your contact email)'
      # AI extraction. Gemini and Groq have free tiers: set their keys in the dashboard
      # (Render asks for sync: false values on first deploy). Without any key, places are
      # extracted on the phone. Claude is optional and paid per use.
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # - key: ANTHROPIC_API_KEY
      #   sync: false
